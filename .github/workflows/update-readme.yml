name: Update README

on:
  # Daily cron removed 2026-08-07. It pushed a commit most mornings, which meant a bot
  # authored the top of the profile, buried real commits under "Auto-update README", and
  # silently reverted hand edits -- it re-published a stale job title the same day it was
  # corrected. Manual only now: run it from the Actions tab when the dates need a refresh.
  workflow_dispatch:

jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Update README
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python scripts/update_readme.py

      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git diff --quiet README.md || (git add README.md && git commit -m "Auto-update README with latest repo dates" && git push)
